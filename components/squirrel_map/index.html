<!doctype html>
<!--
  中大松鼠地圖元件（Streamlit 自訂元件，純 HTML + JavaScript，不需要 npm）
  ─────────────────────────────────────────────
  Python 端（map_component.py）把資料傳進來 → 這裡畫出地圖 → 使用者點區域或用方向鍵走過去
  → 松鼠走到那裡 → 把 {"zone": 區域id, "ts": 時間} 回傳給 Python
  與 Streamlit 溝通用的是官方元件協定（postMessage）：
    componentReady / render / setFrameHeight / setComponentValue
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  :root {
    --grass: #DCEBC6; --grass2: #CFE3B4; --road: #F2E4C4; --ink: #3B2A1A;
    --lost: #E0524C; --found: #2F9E62; --task: #F08A24; --event: #8A5CD0; --gold: #F2B630;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; color: var(--ink); background: transparent; }
  #wrap { position: relative; border-radius: 18px; overflow: hidden; background: var(--grass); border: 2px solid #C9B48A; user-select: none; }
  #toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; background: rgba(255, 250, 238, 0.92); border-bottom: 1px solid #E4D3AC; }
  .chip { border: 1.5px solid #D8C69C; background: #fff; border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; transition: all .15s; }
  .chip:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .chip.off { opacity: .4; text-decoration: line-through; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .spacer { flex: 1; }
  .btn { border: 1.5px solid #D8C69C; background: #fff; border-radius: 8px; width: 28px; height: 28px; cursor: pointer; font-size: 15px; line-height: 1; }
  .btn:hover { background: #FFF5DA; }
  #hint { font-size: 12px; color: #7A6A50; padding: 0 4px; }
  @media (max-width: 980px) { #hint { display: none; } }
  svg { display: block; width: 100%; height: auto; cursor: grab; outline: none; }
  svg.dragging { cursor: grabbing; }
  .zone { cursor: pointer; transition: filter .15s; }
  .zone:hover { filter: brightness(1.08) drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
  .zone-label { font-size: 15px; font-weight: 700; fill: #3B2A1A; pointer-events: none; paint-order: stroke; stroke: rgba(255,255,255,.85); stroke-width: 4px; }
  .selected-ring { fill: none; stroke: var(--gold); stroke-width: 4; stroke-dasharray: 10 6; animation: dash 1.2s linear infinite; pointer-events: none; }
  .search-ring { fill: none; stroke: #FFE14D; stroke-width: 7; opacity: .9; animation: glow 1.1s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes dash { to { stroke-dashoffset: -32; } }
  @keyframes glow { from { opacity: .35; } to { opacity: 1; } }
  .badge { cursor: pointer; }
  .badge-bg { fill: #fff; stroke: #3B2A1A; stroke-width: 1.5; filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
  .badge-num { font-size: 14px; font-weight: 800; fill: #3B2A1A; }
  .pulse { fill: none; stroke: #E0524C; stroke-width: 3; animation: pulse 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { opacity: .9; transform: scale(.8); } 100% { opacity: 0; transform: scale(1.8); } }
  .sq { transition: opacity .3s; }
  .sq-idle { animation: bob 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px) rotate(-2deg); } }
  .gold { animation: floaty 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; pointer-events: none; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-5px) rotate(6deg); } }
  .sparkle { animation: twinkle 1.2s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .2; } to { opacity: 1; } }
  .name-bg { fill: #fff; stroke: #C9B48A; stroke-width: 1; }
  .name-bg.me { fill: #FFE7A3; stroke: #E0A800; }
  .name-text { font-size: 12px; font-weight: 700; fill: #3B2A1A; }
  #tip { position: absolute; pointer-events: none; background: rgba(255,253,246,.97); border: 1.5px solid #C9B48A; border-radius: 12px; padding: 8px 11px; font-size: 13px; min-width: 150px; max-width: 240px; box-shadow: 0 6px 18px rgba(0,0,0,.15); display: none; z-index: 5; }
  #tip b { font-size: 14px; }
  #tip .row { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
  #tip .muted { color: #8A7A60; font-size: 12px; margin-top: 4px; }
  #toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%) translateY(20px); background: #3B2A1A; color: #FFF3D6; padding: 7px 14px; border-radius: 999px; font-size: 14px; opacity: 0; transition: all .3s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="wrap">
  <div id="toolbar">
    <span class="chip" data-layer="lost"><span class="dot" style="background:var(--lost)"></span>遺失 <span id="n-lost">0</span></span>
    <span class="chip" data-layer="found"><span class="dot" style="background:var(--found)"></span>拾獲 <span id="n-found">0</span></span>
    <span class="chip" data-layer="task"><span class="dot" style="background:var(--task)"></span>任務 <span id="n-task">0</span></span>
    <span class="chip" data-layer="event"><span class="dot" style="background:var(--event)"></span>活動 <span id="n-event">0</span></span>
    <span class="chip" id="chip-others">🐿️ 其他松鼠</span>
    <span class="chip" id="chip-gold" style="display:none;border-color:#E9B949;background:#FFF6D6">✨ 今日金松果 <span id="n-gold">0</span></span>
    <span class="spacer"></span>
    <span id="hint" title="點地圖後可用方向鍵／WASD 走路">點區域走過去・方向鍵可走路</span>
    <button class="btn" id="zin" title="放大">＋</button>
    <button class="btn" id="zout" title="縮小">－</button>
    <button class="btn" id="zreset" title="回到全圖">⟲</button>
  </div>
  <svg id="map" viewBox="0 0 1000 640" tabindex="0">
    <defs>
      <pattern id="grassTex" width="40" height="40" patternUnits="userSpaceOnUse">
        <rect width="40" height="40" fill="#DCEBC6"/>
        <path d="M6 30 l2 -6 l2 6 M26 12 l2 -6 l2 6" stroke="#C5DCA6" stroke-width="1.5" fill="none"/>
      </pattern>
      <pattern id="windows" width="16" height="14" patternUnits="userSpaceOnUse">
        <rect x="3" y="3" width="8" height="6" rx="1" fill="rgba(255,255,255,.55)"/>
      </pattern>
      <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#8FD0EA"/><stop offset="1" stop-color="#5BB1D6"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
        <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#5A4A2A" flood-opacity=".25"/>
      </filter>
    </defs>
    <g id="world">
      <rect x="-500" y="-500" width="2000" height="1640" fill="url(#grassTex)"/>
      <g id="roads"></g>
      <g id="decor"></g>
      <g id="zones"></g>
      <g id="treasures"></g>
      <g id="squirrels"></g>
      <g id="badges"></g>
    </g>
  </svg>
  <div id="tip"></div>
  <div id="toast"></div>
</div>

<script>
// ───────────────────────── Streamlit 溝通 ─────────────────────────
function sendToStreamlit(type, data) {
  const msg = Object.assign({ isStreamlitMessage: true, type: type }, data || {});
  window.parent.postMessage(msg, "*");
}
function setFrameHeight() {
  sendToStreamlit("streamlit:setFrameHeight", { height: document.getElementById("wrap").offsetHeight + 4 });
}
function setValue(value) {
  sendToStreamlit("streamlit:setComponentValue", { value: value, dataType: "json" });
}

// ───────────────────────── 狀態 ─────────────────────────
const NS = "http://www.w3.org/2000/svg";
const COLORS = { lost: "#E0524C", found: "#2F9E62", task: "#F08A24", event: "#8A5CD0" };
const LAYER_NAMES = { lost: "遺失", found: "拾獲", task: "任務", event: "活動" };
let DATA = null;                 // Python 傳來的資料
let layers = { lost: true, found: true, task: true, event: true };
let showOthers = true;
let cam = { x: 0, y: 0, s: 1 };  // 鏡頭：平移與縮放
let me = { x: 120, y: 590, face: 1, walking: false, el: null, zone: null, serverZone: null };
let keys = {};
let decorDone = false;

const svg = document.getElementById("map");
const world = document.getElementById("world");
const tip = document.getElementById("tip");

function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function zoneById(id) {
  if (!DATA) return null;
  for (const z of DATA.zones) if (z.id === id) return z;
  return null;
}
function standPoint(z) { return { x: z.x, y: z.y + z.h / 2 + 26 }; }

// ───────────────────────── 鏡頭（縮放、拖曳） ─────────────────────────
function applyCam() { world.setAttribute("transform", `translate(${cam.x},${cam.y}) scale(${cam.s})`); }
function zoomAt(factor, cx, cy) {
  const ns = Math.min(2.6, Math.max(0.8, cam.s * factor));
  cam.x = cx - (cx - cam.x) * (ns / cam.s);
  cam.y = cy - (cy - cam.y) * (ns / cam.s);
  cam.s = ns; applyCam();
}
document.getElementById("zin").onclick = () => zoomAt(1.25, 500, 320);
document.getElementById("zout").onclick = () => zoomAt(0.8, 500, 320);
document.getElementById("zreset").onclick = () => { cam = { x: 0, y: 0, s: 1 }; applyCam(); };

function toWorld(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(world.getScreenCTM().inverse());
}
function toSvg(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
let drag = null;
svg.addEventListener("pointerdown", (e) => {
  svg.focus();
  const p = toSvg(e);
  drag = { sx: p.x, sy: p.y, cx: cam.x, cy: cam.y, moved: 0 };
});
window.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const p = toSvg(e);
  const dx = p.x - drag.sx, dy = p.y - drag.sy;
  drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
  if (drag.moved > 6) { svg.classList.add("dragging"); cam.x = drag.cx + dx; cam.y = drag.cy + dy; applyCam(); }
});
window.addEventListener("pointerup", () => { setTimeout(() => { drag = null; }, 0); svg.classList.remove("dragging"); });
svg.addEventListener("wheel", (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;     // 按住 Ctrl 才用滾輪縮放，避免擋到網頁捲動
  e.preventDefault();
  const p = toSvg(e);
  zoomAt(e.deltaY < 0 ? 1.12 : 0.9, p.x, p.y);
}, { passive: false });

// ───────────────────────── 畫地圖底圖（道路、松樹） ─────────────────────────
const ROADS = [["gate","admin"],["admin","library"],["library","activity"],["activity","science"],["science","dorm"],
               ["activity","management"],["library","canteen"],["canteen","backgate"],["engineering","backgate"],
               ["activity","engineering"],["admin","sports"],["library","lake"],["lake","literature"],["literature","science"],
               ["management","engineering"],["sports","lake"]];
function drawRoads() {
  const g = document.getElementById("roads");
  g.innerHTML = "";
  roadPts = [];
  for (const r of ROADS) {
    const a = zoneById(r[0]), b = zoneById(r[1]);
    if (!a || !b) continue;
    const mx = (a.x + b.x) / 2 + (a.y - b.y) * 0.12, my = (a.y + b.y) / 2 + (b.x - a.x) * 0.12;
    const d = `M${a.x} ${a.y} Q${mx} ${my} ${b.x} ${b.y}`;
    el("path", { d: d, stroke: "#E2CFA4", "stroke-width": 24, fill: "none", "stroke-linecap": "round" }, g);
    el("path", { d: d, stroke: "#F6EBD0", "stroke-width": 18, fill: "none", "stroke-linecap": "round" }, g);
    el("path", { d: d, stroke: "#fff", "stroke-width": 2, fill: "none", "stroke-dasharray": "8 10", opacity: .8 }, g);
    for (let i = 0; i <= 24; i++) {          // 記下道路經過的點，松樹不要種在路上
      const t = i / 24;
      roadPts.push([(1 - t) * (1 - t) * a.x + 2 * (1 - t) * t * mx + t * t * b.x, (1 - t) * (1 - t) * a.y + 2 * (1 - t) * t * my + t * t * b.y]);
    }
  }
}
let roadPts = [];
function nearRoad(x, y) {
  for (const p of roadPts) if (Math.abs(p[0] - x) < 24 && Math.abs(p[1] - y) < 24) return true;
  return false;
}
function insideAnyZone(x, y, pad) {
  for (const z of DATA.zones) {
    if (Math.abs(x - z.x) < z.w / 2 + pad && Math.abs(y - z.y) < z.h / 2 + pad + 20) return true;
  }
  return false;
}
function drawPine(g, x, y, s) {
  const t = el("g", { transform: `translate(${x},${y}) scale(${s})` }, g);
  el("rect", { x: -2.5, y: 8, width: 5, height: 9, fill: "#7A5230" }, t);
  el("path", { d: "M0 -26 L13 -6 L-13 -6 Z", fill: "#3E7D4A" }, t);
  el("path", { d: "M0 -16 L16 6 L-16 6 Z", fill: "#356E40" }, t);
  el("path", { d: "M0 -6 L18 12 L-18 12 Z", fill: "#2D6038" }, t);
}
function drawDecor() {
  if (decorDone) return;
  const g = document.getElementById("decor");
  let seed = 7;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  let placed = 0;
  for (let i = 0; i < 600 && placed < 34; i++) {
    const x = 20 + rnd() * 960, y = 30 + rnd() * 590;
    if (insideAnyZone(x, y, 34) || nearRoad(x, y)) continue;
    drawPine(g, x, y, 0.6 + rnd() * 0.4);
    placed++;
  }
  decorDone = true;
}

// ───────────────────────── 畫區域 ─────────────────────────
function drawZones() {
  const g = document.getElementById("zones");
  g.innerHTML = "";
  for (const z of DATA.zones) {
    const zg = el("g", { class: "zone", "data-id": z.id }, g);
    const x0 = z.x - z.w / 2, y0 = z.y - z.h / 2;
    if (z.shape === "lake") {
      el("ellipse", { cx: z.x, cy: z.y, rx: z.w / 2 + 6, ry: z.h / 2 + 6, fill: "#B9D99A" }, zg);
      el("ellipse", { cx: z.x, cy: z.y, rx: z.w / 2, ry: z.h / 2, fill: "url(#water)", filter: "url(#shadow)" }, zg);
      for (let i = 0; i < 3; i++) {
        el("path", { d: `M${z.x - 50 + i * 35} ${z.y - 18 + i * 14} q8 -5 16 0 q8 5 16 0`, stroke: "#E8F6FC", "stroke-width": 2, fill: "none", opacity: .8 }, zg);
      }
    } else if (z.shape === "field") {
      el("rect", { x: x0, y: y0, width: z.w, height: z.h, rx: z.h / 2, fill: "#C9654A", filter: "url(#shadow)" }, zg);
      el("rect", { x: x0 + 12, y: y0 + 12, width: z.w - 24, height: z.h - 24, rx: (z.h - 24) / 2, fill: "#7DBB5E" }, zg);
      el("line", { x1: z.x, y1: y0 + 12, x2: z.x, y2: y0 + z.h - 12, stroke: "#fff", "stroke-width": 2, opacity: .7 }, zg);
    } else if (z.shape === "gate") {
      el("rect", { x: x0, y: y0 + 8, width: 14, height: z.h - 8, fill: "#B33A2E", filter: "url(#shadow)" }, zg);
      el("rect", { x: x0 + z.w - 14, y: y0 + 8, width: 14, height: z.h - 8, fill: "#B33A2E" }, zg);
      el("rect", { x: x0 - 8, y: y0, width: z.w + 16, height: 14, rx: 4, fill: "#8C2B22" }, zg);
      el("rect", { x: x0 + 14, y: y0 + 22, width: z.w - 28, height: z.h - 22, fill: "rgba(255,255,255,.01)" }, zg);
    } else {
      el("rect", { x: x0, y: y0 + 6, width: z.w, height: z.h, rx: 12, fill: "#C2A57A" }, zg);
      el("rect", { x: x0, y: y0, width: z.w, height: z.h, rx: 12, fill: "#F7EBD3", stroke: "#B99467", "stroke-width": 2, filter: "url(#shadow)" }, zg);
      el("rect", { x: x0 + 8, y: y0 + 36, width: z.w - 16, height: z.h - 42, rx: 6, fill: "url(#windows)", opacity: .9 }, zg);
      el("rect", { x: x0, y: y0, width: z.w, height: 10, rx: 5, fill: "#9C6B3E" }, zg);
    }
    let labelY = y0 + 29;                       // 建築物：名字寫在屋頂下方，松鼠站在門口不會擋到
    if (z.shape === "gate") labelY = y0 - 8;    // 校門：名字寫在橫樑上方
    if (z.shape === "lake") labelY = z.y + 6;
    if (z.shape === "field") labelY = z.y + 5;
    const label = el("text", { x: z.x, y: labelY, "text-anchor": "middle", class: "zone-label" }, zg);
    label.textContent = z.emoji + " " + z.name;

    // 搜尋高亮、選取框
    if (DATA.highlight && DATA.highlight.indexOf(z.id) >= 0) {
      el("rect", { x: x0 - 10, y: y0 - 10, width: z.w + 20, height: z.h + 20, rx: 18, class: "search-ring" }, zg);
    }
    if (DATA.selected === z.id) {
      el("rect", { x: x0 - 6, y: y0 - 6, width: z.w + 12, height: z.h + 12, rx: 16, class: "selected-ring" }, zg);
    }
    zg.addEventListener("click", () => { if (drag && drag.moved > 6) return; walkToZone(z.id); });
    zg.addEventListener("mousemove", (e) => showTip(e, z));
    zg.addEventListener("mouseleave", hideTip);
  }
}

// ───────────────────────── 畫徽章（一個區域一個，避免雜亂） ─────────────────────────
function visibleCount(z) {
  let n = 0;
  for (const k in layers) if (layers[k]) n += z.counts[k];
  return n;
}
function drawBadges() {
  const g = document.getElementById("badges");
  g.innerHTML = "";
  const totals = { lost: 0, found: 0, task: 0, event: 0 };
  for (const z of DATA.zones) {
    for (const k in totals) totals[k] += z.counts[k];
    const n = visibleCount(z);
    if (n === 0) continue;
    const kinds = [];
    for (const k of ["lost", "found", "task", "event"]) if (layers[k] && z.counts[k] > 0) kinds.push(k);
    const w = 26 + kinds.length * 10 + (n >= 10 ? 8 : 0);
    const bx = z.x + z.w / 2 - 10, by = z.y - z.h / 2 - (z.shape === "gate" ? 30 : 8);
    const bg = el("g", { class: "badge", transform: `translate(${bx},${by})` }, g);
    if (z.new) el("circle", { cx: 0, cy: 0, r: 16, class: "pulse" }, bg);
    el("rect", { x: -w / 2, y: -13, width: w, height: 26, rx: 13, class: "badge-bg" }, bg);
    let dx = -w / 2 + 10;
    for (const k of kinds) { el("circle", { cx: dx, cy: 0, r: 4, fill: COLORS[k] }, bg); dx += 10; }
    const t = el("text", { x: dx + 2, y: 5, class: "badge-num" }, bg);
    t.textContent = n;
    if (z.urgent && layers.task) {
      const u = el("text", { x: w / 2 - 2, y: -9, "font-size": 15 }, bg);
      u.textContent = "⏰";
    }
    bg.addEventListener("click", () => walkToZone(z.id));
    bg.addEventListener("mousemove", (e) => showTip(e, z));
    bg.addEventListener("mouseleave", hideTip);
  }
  for (const k in totals) document.getElementById("n-" + k).textContent = totals[k];
}

// ───────────────────────── 松鼠 ─────────────────────────
function makeSquirrel(parent, svgText, label, isMe, online) {
  const g = el("g", { class: "sq" }, parent);
  const flip = el("g", {}, g);
  const body = el("g", { class: "sq-idle" }, flip);
  body.innerHTML = svgText;
  const inner = body.querySelector("svg");
  const size = isMe ? 54 : 42;
  if (inner) { inner.setAttribute("x", -size / 2); inner.setAttribute("y", -size + 4); inner.setAttribute("width", size); inner.setAttribute("height", size); }
  const tw = label.length * 12 + 16;
  el("rect", { x: -tw / 2, y: 7, width: tw, height: 18, rx: 9, class: "name-bg" + (isMe ? " me" : "") }, g);
  const t = el("text", { x: 0, y: 20, "text-anchor": "middle", class: "name-text" }, g);
  t.textContent = label;
  if (!isMe && online) el("circle", { cx: tw / 2 - 4, cy: 9, r: 4, fill: "#3CC56B", stroke: "#fff", "stroke-width": 1.5 }, g);
  if (!isMe && !online) g.setAttribute("opacity", 0.55);
  g.flip = flip;
  return g;
}
function placeSquirrel(g, x, y, face) {
  g.setAttribute("transform", `translate(${x},${y})`);
  g.flip.setAttribute("transform", face > 0 ? "scale(-1,1)" : "");
}
const OFFSETS = [[-62, 4], [62, 4], [-34, 26], [34, 26], [-90, 18], [90, 18]];
function drawSquirrels() {
  const g = document.getElementById("squirrels");
  g.innerHTML = "";
  if (showOthers && DATA.others) {
    const perZone = {};
    for (const o of DATA.others) {
      const z = zoneById(o.zone);
      if (!z) continue;
      const i = perZone[o.zone] || 0;
      perZone[o.zone] = i + 1;
      if (i >= OFFSETS.length) continue;          // 同一區最多畫 6 隻，避免擠成一團
      const p = standPoint(z);
      const s = makeSquirrel(g, o.svg, o.name, false, o.online);
      placeSquirrel(s, p.x + OFFSETS[i][0], p.y + OFFSETS[i][1], OFFSETS[i][0] > 0 ? -1 : 1);
    }
  }
  if (DATA.me) {
    me.el = makeSquirrel(g, DATA.me.svg, "我・" + DATA.me.name, true, true);
    placeSquirrel(me.el, me.x, me.y, me.face);
  }
}

// 今日金松果：畫在還沒撿的區域左上角，會上下漂浮
function drawTreasures() {
  const g = document.getElementById("treasures");
  g.innerHTML = "";
  const list = DATA.treasures || [];
  const chip = document.getElementById("chip-gold");
  chip.style.display = DATA.me ? "inline-flex" : "none";
  document.getElementById("n-gold").textContent = list.length + " 顆待撿";
  for (const zid of list) {
    const z = zoneById(zid);
    if (!z) continue;
    const tx = z.x - z.w / 2 + 6, ty = z.y - z.h / 2 - 12;
    const wrap = el("g", { transform: `translate(${tx},${ty})` }, g);
    el("circle", { cx: 0, cy: 0, r: 15, fill: "#FFE9A0", opacity: .55, class: "sparkle" }, wrap);
    const pc = el("g", { class: "gold" }, wrap);
    el("ellipse", { cx: 0, cy: 1, rx: 7, ry: 9, fill: "#F5C518", stroke: "#B8860B", "stroke-width": 1.2 }, pc);
    el("path", { d: "M-6 -2 L6 -2 M-6 2.5 L6 2.5 M-5 6.5 L5 6.5", stroke: "#B8860B", "stroke-width": 1.1 }, pc);
    el("path", { d: "M0 -8 L0 -12", stroke: "#6B4A1A", "stroke-width": 2, "stroke-linecap": "round" }, pc);
    const sp = el("text", { x: 9, y: -7, "font-size": 11, class: "sparkle" }, wrap);
    sp.textContent = "✨";
  }
}

// 走到某個區域（點擊或方向鍵抵達時）
function walkToZone(zoneId) {
  const z = zoneById(zoneId);
  if (!z) return;
  hideTip();
  if (!DATA.me) { arrive(zoneId); return; }       // 訪客：沒有松鼠，直接打開區域
  const target = standPoint(z);
  walkTo(target.x, target.y, () => arrive(zoneId));
}
function walkTo(tx, ty, done) {
  const sx = me.x, sy = me.y;
  const dist = Math.hypot(tx - sx, ty - sy);
  if (dist < 4) { if (done) done(); return; }
  const dur = Math.min(1600, Math.max(450, dist * 2.2));
  const hops = Math.max(2, Math.round(dist / 60));
  me.face = tx > sx ? 1 : -1;
  me.walking = true;
  const t0 = performance.now();
  function step(now) {
    const t = Math.min(1, (now - t0) / dur);
    const e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    me.x = sx + (tx - sx) * e;
    me.y = sy + (ty - sy) * e;
    const hop = Math.abs(Math.sin(t * Math.PI * hops)) * 10;
    if (me.el) placeSquirrel(me.el, me.x, me.y - hop, me.face);
    if (t < 1) requestAnimationFrame(step);
    else { me.walking = false; if (me.el) placeSquirrel(me.el, me.x, me.y, me.face); if (done) done(); }
  }
  requestAnimationFrame(step);
}
function arrive(zoneId) {
  me.zone = zoneId;
  const z = zoneById(zoneId);
  const list = DATA.treasures || [];
  if (DATA.me && list.indexOf(zoneId) >= 0) {
    toast("✨ 撿到金松果！");
    DATA.treasures = list.filter((t) => t !== zoneId);     // 先在畫面上拿掉，Python 會正式發松果
    drawTreasures();
  } else {
    toast("🐿️ 抵達「" + z.name + "」");
  }
  setValue({ zone: zoneId, ts: Date.now() });
}

// 方向鍵／WASD 自由走路
const KEYMAP = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0] };
let stopTimer = null;
svg.addEventListener("keydown", (e) => {
  if (!KEYMAP[e.key] || !DATA || !DATA.me) return;
  e.preventDefault();
  if (!keys[e.key]) { keys[e.key] = true; if (Object.keys(keys).length === 1) requestAnimationFrame(freeWalk); }
  clearTimeout(stopTimer);
});
svg.addEventListener("keyup", (e) => {
  delete keys[e.key];
  if (Object.keys(keys).length === 0) {
    clearTimeout(stopTimer);
    stopTimer = setTimeout(checkNearbyZone, 380);
  }
});
function freeWalk() {
  if (Object.keys(keys).length === 0 || me.walking) return;
  let dx = 0, dy = 0;
  for (const k in keys) { dx += KEYMAP[k][0]; dy += KEYMAP[k][1]; }
  const len = Math.hypot(dx, dy) || 1;
  me.x = Math.min(990, Math.max(10, me.x + dx / len * 4));
  me.y = Math.min(630, Math.max(40, me.y + dy / len * 4));
  if (dx !== 0) me.face = dx > 0 ? 1 : -1;
  const hop = Math.abs(Math.sin(performance.now() / 70)) * 5;
  placeSquirrel(me.el, me.x, me.y - hop, me.face);
  requestAnimationFrame(freeWalk);
}
function checkNearbyZone() {
  placeSquirrel(me.el, me.x, me.y, me.face);
  let best = null, bestD = 99999;
  for (const z of DATA.zones) {
    const p = standPoint(z);
    const d = Math.hypot(p.x - me.x, (p.y - me.y) * 1.3);
    if (d < bestD) { bestD = d; best = z; }
  }
  if (best && bestD < 95 && best.id !== me.zone) walkToZone(best.id);
}

// ───────────────────────── 提示框、通知 ─────────────────────────
function showTip(e, z) {
  let html = `<b>${z.emoji} ${z.name}</b>`;
  let any = false;
  for (const k of ["lost", "found", "task", "event"]) {
    if (z.counts[k] > 0) { any = true; html += `<div class="row"><span class="dot" style="background:${COLORS[k]}"></span>${LAYER_NAMES[k]} ${z.counts[k]} 筆</div>`; }
  }
  if (!any) html += `<div class="muted">目前很安靜，沒有刊登</div>`;
  if (z.titles && z.titles.length) {
    html += `<div class="muted">`;
    for (const t of z.titles) html += `・${escapeHtml(t.text)}<br>`;
    html += `</div>`;
  }
  const here = [];
  if (DATA.others) for (const o of DATA.others) if (o.zone === z.id) here.push(o.name);
  if (here.length && showOthers) html += `<div class="muted">🐿️ ${here.map(escapeHtml).join("、")} 在這裡</div>`;
  if (z.urgent) html += `<div class="muted">⏰ 有任務 3 小時內截止</div>`;
  html += `<div class="muted">點一下讓松鼠走過去</div>`;
  tip.innerHTML = html;
  tip.style.display = "block";
  const box = document.getElementById("wrap").getBoundingClientRect();
  let left = e.clientX - box.left + 14, top = e.clientY - box.top + 14;
  if (left + 250 > box.width) left = e.clientX - box.left - 250;
  if (top + tip.offsetHeight > box.height) top = e.clientY - box.top - tip.offsetHeight - 10;
  tip.style.left = left + "px"; tip.style.top = top + "px";
}
function hideTip() { tip.style.display = "none"; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
let toastTimer = null;
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}

// ───────────────────────── 圖層開關 ─────────────────────────
for (const chip of document.querySelectorAll(".chip[data-layer]")) {
  chip.addEventListener("click", () => {
    const k = chip.getAttribute("data-layer");
    layers[k] = !layers[k];
    chip.classList.toggle("off", !layers[k]);
    if (DATA) drawBadges();
  });
}
document.getElementById("chip-others").addEventListener("click", function () {
  showOthers = !showOthers;
  this.classList.toggle("off", !showOthers);
  if (DATA) drawSquirrels();
});

// ───────────────────────── 收到 Python 的資料 ─────────────────────────
function onRender(args) {
  const first = DATA === null;
  DATA = args;
  if (DATA.me) {
    const z = zoneById(DATA.me.zone);
    // 伺服器上的位置變了（例如從別的頁面回來）而且松鼠沒在走 → 直接站到那裡
    if (z && DATA.me.zone !== me.serverZone && !me.walking) {
      const p = standPoint(z);
      if (first || DATA.me.zone !== me.zone) { me.x = p.x; me.y = p.y; }
      me.zone = DATA.me.zone;
    }
    me.serverZone = DATA.me.zone;
  }
  drawRoads();
  drawDecor();
  drawZones();
  drawTreasures();
  drawSquirrels();
  drawBadges();
  if (first && DATA.selected) {
    // 第一次載入且有選定區域：把鏡頭稍微拉近
    const z = zoneById(DATA.selected);
    if (z) { cam = { x: 0, y: 0, s: 1 }; applyCam(); }
  }
  setFrameHeight();
}
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "streamlit:render") onRender(e.data.args);
});
window.addEventListener("resize", setFrameHeight);
sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
setFrameHeight();
</script>
